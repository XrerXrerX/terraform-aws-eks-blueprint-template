# Static checks on every PR: formatting, validation, offline plan tests and
# lint. Needs NO cloud credentials — every provider is mocked in tests/.
name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (root)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform test (offline, all providers mocked)
        run: terraform test -var-file=terraform.tfvars.example

      - name: terraform validate (bootstrap)
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          # tflint --init downloads the AWS ruleset via the GitHub API;
          # unauthenticated calls from shared runners hit the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

